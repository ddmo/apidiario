<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>

  <!-- Full square background (system applies the mask) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Honeycomb cell -->
  <polygon
    points="256,96 394,176 394,336 256,416 118,336 118,176"
    fill="url(#hex)"
    stroke="#FFFFFF"
    stroke-width="8"
    stroke-linejoin="round"/>

  <!-- Bee wings -->
  <ellipse cx="200" cy="216" rx="44" ry="28" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"
           transform="rotate(-28 200 216)" opacity="0.92"/>
  <ellipse cx="312" cy="216" rx="44" ry="28" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"
           transform="rotate(28 312 216)" opacity="0.92"/>

  <!-- Bee body -->
  <ellipse cx="256" cy="282" rx="60" ry="76" fill="#1F2937"/>

  <!-- Yellow stripes -->
  <path d="M 200,254 Q 256,266 312,254" stroke="#FBBF24" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M 198,296 Q 256,308 314,296" stroke="#FBBF24" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="240" cy="234" r="6" fill="#FFFFFF"/>
  <circle cx="272" cy="234" r="6" fill="#FFFFFF"/>

  <!-- Antennae -->
  <path d="M 244,210 Q 232,194 222,184" stroke="#1F2937" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 268,210 Q 280,194 290,184" stroke="#1F2937" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="222" cy="184" r="4" fill="#1F2937"/>
  <circle cx="290" cy="184" r="4" fill="#1F2937"/>
</svg>
